<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kugel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kugel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ECEEE9" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: Kessel + Verlauf + Einsatzleiste links, senkrechtes Tableau rechts; am Handy gestapelt mit klebender Einsatzleiste */
:root{
  --bg:#ECEEE9; --surface:#FAFBF8; --fg:#16201B; --muted:#646E68; --line:#D4D9D3;
  --felt:#1D5440; --felt-ink:#E7F1EB; --felt-line:rgba(231,241,235,.24);
  --red:#B5322B; --black:#191D1B; --zero:#2A7D52;
  --accent:#A8792C; --accent-ink:#FFFFFF;
  --win:#1F8A50; --lose:#C0392F; --win-fill:rgba(31,138,80,.16); --lose-fill:rgba(192,57,47,.14);
  --rim:#2A231F; --rim2:#463A31; --cone:#CDB98F; --cone2:#9C8761;
  --c10:#ECE7DC; --c10-ink:#2A2620; --c20:#C23A2F; --c50:#2C7A4D; --cx:#2B5C9E; --call:#24272C; --chip-ink:#FFFFFF;
  --scrim:rgba(10,14,12,.45);
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1311; --surface:#151D1A; --fg:#E6ECE8; --muted:#8B958F; --line:#25302B;
    --felt:#163F30; --felt-ink:#DCEAE2; --felt-line:rgba(220,234,226,.18);
    --red:#C23C34; --black:#070908; --zero:#2B8657;
    --accent:#D2A458; --accent-ink:#1A1408;
    --win:#3DD07F; --lose:#F0675B; --win-fill:rgba(61,208,127,.16); --lose-fill:rgba(240,103,91,.15);
    --rim:#1C1714; --rim2:#3A3029; --cone:#B9A57C; --cone2:#7E6C4C;
    --call:#3A3F46; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151D1A; --fg:#E6ECE8; --muted:#8B958F; --line:#25302B;
  --felt:#163F30; --felt-ink:#DCEAE2; --felt-line:rgba(220,234,226,.18);
  --red:#C23C34; --black:#070908; --zero:#2B8657;
  --accent:#D2A458; --accent-ink:#1A1408;
  --win:#3DD07F; --lose:#F0675B; --win-fill:rgba(61,208,127,.16); --lose-fill:rgba(240,103,91,.15);
  --rim:#1C1714; --rim2:#3A3029; --cone:#B9A57C; --cone2:#7E6C4C;
  --call:#3A3F46; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 0;display:grid;gap:16px;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "wheel" "table" "controls" "graph"}
@media (min-width:860px){
  .app{grid-template-columns:minmax(0,1fr) minmax(0,440px);grid-template-areas:"top top" "wheel table" "graph table" "controls table";align-items:start;column-gap:40px;padding-block:24px 32px}
}

/* Kopfzeile */
.top{grid-area:top;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.bal{margin-left:auto;text-align:right;border:0;background:transparent;padding:4px 6px;border-radius:12px}
.bal:active{background:var(--line)}
.bal-label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:5px;justify-content:flex-end;align-items:center}
.bal-label svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2}
.bal-val{font-family:var(--display);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.05;transition:color .3s}
.bal-val.up{color:var(--win)} .bal-val.down{color:var(--lose)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.armed{border-color:var(--lose);color:var(--lose)}

/* Kessel */
.wheel-area{grid-area:wheel;overflow-x:clip;display:grid;gap:12px;justify-items:center}
.wheel-wrap{position:relative;width:min(100%,370px);aspect-ratio:1;max-width:100%;border-radius:50%}
.wheel-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wheel-wrap #fx{pointer-events:none;inset:-12%;width:124%;height:124%}
.wheel-wrap.glow{animation:glow 1.1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--accent)}35%{box-shadow:0 0 0 10px transparent,0 0 60px 10px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.hub{position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-weight:600;font-size:clamp(26px,9vw,40px);color:#fff;font-variant-numeric:tabular-nums;z-index:2;
  background:var(--rim2);box-shadow:inset 0 2px 10px rgba(0,0,0,.35);transition:background .3s,transform .3s,opacity .25s}
.hub.red{background:var(--red)} .hub.black{background:var(--black)} .hub.zero{background:var(--zero)}
.hub.dim{opacity:0;transform:translate(-50%,-50%) scale(.85)}
.hub.pop{animation:pop .55s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5)}100%{transform:translate(-50%,-50%) scale(1)}}

.msg{min-height:24px;font-weight:700;font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.msg.win{color:var(--win)} .msg.lose{color:var(--lose)} .msg.info{color:var(--muted);font-weight:600}
.msg.big{font-size:19px;animation:pop2 .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop2{0%{transform:scale(.7)}100%{transform:scale(1)}}
.history{display:flex;gap:5px;flex-wrap:nowrap;justify-content:center;max-width:100%;min-height:26px;overflow:hidden}
.history span{flex:0 0 auto}
.history span{min-width:26px;height:26px;padding:0 4px;border-radius:13px;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.history span.red{background:var(--red)} .history span.black{background:var(--black);box-shadow:inset 0 0 0 1px var(--line)} .history span.zero{background:var(--zero)}
.history .empty{color:var(--muted);font-weight:600;font-size:12.5px}

/* Verlauf-Graph */
.graph{grid-area:graph;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;width:100%;max-width:400px;justify-self:center}
.graph-head{display:flex;align-items:baseline;gap:8px}
.graph-label{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.graph-val{margin-left:auto;font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.graph-val.pos{color:var(--win)} .graph-val.neg{color:var(--lose)}
.graph-sub{display:flex;gap:12px;font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;margin-top:6px}
.graph-sub b{color:var(--fg);font-weight:700}
#chart{display:block;width:100%;height:76px;margin-top:6px}

/* Einsatzfeld */
.board{grid-area:table;display:grid;gap:14px;width:100%;max-width:440px;justify-self:center;align-content:start}
.panel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.bet{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:800;font-size:16px;color:var(--fg);padding:8px;transition:transform .08s;font-variant-numeric:tabular-nums}
.bet small{font-size:11px;font-weight:700;color:var(--muted)}
.bet.half{grid-column:span 3} .bet.third{grid-column:span 2}
.bet.red,.bet.black{color:#fff;border-color:transparent;min-height:64px;font-size:18px}
.bet.red{background:var(--red)} .bet.black{background:var(--black);box-shadow:inset 0 0 0 1px var(--line)}
.bet.red small,.bet.black small{color:rgba(255,255,255,.72)}
.panel.nums{gap:6px}
.num{position:relative;border:0;border-radius:10px;height:46px;font-weight:800;font-size:15px;color:#fff;font-variant-numeric:tabular-nums;padding:0;transition:transform .08s}
.num.red{background:var(--red)} .num.black{background:var(--black);box-shadow:inset 0 0 0 1px var(--line)} .num.zero{background:var(--zero);grid-column:span 3}
.bet:active,.num:active{transform:scale(.95)}
.panel-hint{grid-column:1/-1;font-size:12px;color:var(--muted);font-weight:600;text-align:center;padding-top:2px}
.hit{z-index:2;box-shadow:0 0 0 3px var(--accent),0 0 18px 2px var(--accent)!important;animation:hit 1s ease-in-out 3}
@keyframes hit{50%{box-shadow:0 0 0 3px var(--accent),0 0 4px 0 var(--accent)}}

.stack{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  font:800 10px/1 var(--body);color:var(--chip-ink);pointer-events:none;
  box-shadow:0 2px 0 rgba(0,0,0,.35);animation:drop .2s cubic-bezier(.2,1.6,.4,1);z-index:3}
.stack::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.75)}
.stack.d10{background:var(--c10);color:var(--c10-ink)} .stack.d10::before{border-color:rgba(0,0,0,.35)}
.stack.d20{background:var(--c20)} .stack.d50{background:var(--c50)} .stack.dx{background:var(--cx)} .stack.dall{background:var(--call)}
.stack.lost{opacity:.22;filter:grayscale(1);transition:opacity .5s .15s}
.stack.won{box-shadow:0 0 0 2px var(--accent),0 0 14px var(--accent)}
@keyframes drop{0%{scale:1.6;opacity:0}100%{scale:1;opacity:1}}

/* Einsatzleiste */
.controls{grid-area:controls;display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;
  position:sticky;bottom:0;margin-inline:-6px;box-shadow:0 -10px 30px rgba(0,0,0,.12);z-index:5;margin-bottom:max(10px, env(safe-area-inset-bottom, 0px))}
@media (min-width:860px){.controls{position:static;box-shadow:none;margin:0;max-width:400px;width:100%;justify-self:center}}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.chip{aspect-ratio:1;width:100%;max-width:58px;justify-self:center;border-radius:50%;border:0;position:relative;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--chip-ink);
  box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .15s cubic-bezier(.2,1.6,.4,1), box-shadow .15s;font-variant-numeric:tabular-nums;line-height:1;padding:0}
.chip::before{content:"";position:absolute;inset:4px;border-radius:50%;border:2px dashed rgba(255,255,255,.7)}
.chip span{position:relative;font-size:12px}
.chip small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:2px}
.chip[data-v="10"]{background:var(--c10);color:var(--c10-ink)} .chip[data-v="10"]::before{border-color:rgba(0,0,0,.3)}
.chip[data-v="20"]{background:var(--c20)} .chip[data-v="50"]{background:var(--c50)}
.chip[data-v="custom"]{background:var(--cx)} .chip[data-v="all"]{background:var(--call)}
.chip[data-v="all"] span{font-size:11px;letter-spacing:.02em}
.chip[aria-checked="true"]{transform:translateY(-6px) scale(1.06);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent),0 8px 0 rgba(0,0,0,.15)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;border-radius:12px;padding:6px 2px;font-size:11px;font-weight:700;color:var(--muted)}
.tool svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:active{background:var(--line)}
.tool:disabled{opacity:.3;cursor:not-allowed}
.spin{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;letter-spacing:.02em;padding:15px 18px;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .1s, opacity .2s;font-variant-numeric:tabular-nums}
.spin:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.spin:disabled{opacity:.45;cursor:not-allowed}
.spin .amt{font-family:var(--display);font-weight:600;font-size:18px;opacity:.9}
.spin .amt:empty{display:none}

/* Eingabe-Sheet */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .22s cubic-bezier(.2,1,.3,1)}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px}
.sheet p{margin:-6px 0 0;color:var(--muted);font-size:13px}
.sheet input{width:100%;font:600 28px var(--display);font-variant-numeric:tabular-nums;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.sheet-actions button{border-radius:14px;padding:14px;font-weight:800;border:1px solid var(--line);background:transparent}
.sheet-actions .ok{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.foot{color:var(--muted);font-size:12px;text-align:center;padding-bottom:8px}
@media (min-width:860px){.foot{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Kugel<small>Roulette · Spielgeld</small></div>
    <button class="bal" id="balBtn" aria-label="Guthaben ändern">
      <div class="bal-label">Guthaben <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></div>
      <div class="bal-val" id="balance">1.000</div>
    </button>
    <button class="icon-btn" id="soundBtn" aria-label="Ton aus" title="Ton an/aus"></button>
    <button class="icon-btn" id="resetBtn" aria-label="Verlauf zurücksetzen" title="Verlauf zurücksetzen">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </header>

  <section class="wheel-area" aria-label="Kessel">
    <div class="wheel-wrap" id="wheelWrap">
      <canvas id="wheel" aria-hidden="true"></canvas>
      <canvas id="fx" aria-hidden="true"></canvas>
      <div class="hub" id="hub">–</div>
    </div>
    <div class="msg info" id="msg" aria-live="polite">Wähle einen Chip und tippe aufs Feld.</div>
    <div class="history" id="history" aria-label="Letzte Zahlen"></div>
  </section>

  <section class="graph" aria-label="Gewinn und Verlust">
    <div class="graph-head">
      <span class="graph-label">Gewinn / Verlust</span>
      <span class="graph-val" id="profit">0</span>
    </div>
    <canvas id="chart" aria-hidden="true"></canvas>
    <div class="graph-sub"><span>Runden <b id="sRounds">0</b></span><span>Rekord <b id="sRecord">–</b></span><span>Gesetzt <b id="sWagered">0</b></span></div>
  </section>

  <section class="board" aria-label="Einsätze setzen">
    <div class="panel nums" id="panelNums"></div>
    <div class="panel" id="panelSimple"></div>
  </section>

  <section class="controls" aria-label="Einsätze">
    <div class="chips" role="radiogroup" aria-label="Chipwert" id="chips"></div>
    <div class="tools">
      <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Zurück</button>
      <button class="tool" id="clearBtn"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Leeren</button>
      <button class="tool" id="doubleBtn"><svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="13" font-weight="800" style="fill:var(--fg);stroke:none;font-family:var(--body)">2×</text></svg>Doppeln</button>
    </div>
    <button class="spin" id="spinBtn">Drehen <span class="amt" id="stake"></span></button>
  </section>

  <p class="foot">Amerikanisches Roulette mit 0 und 00. Nur Spielgeld, kein Echtgeld. Dein Stand wird auf diesem Gerät gespeichert.</p>
</div>

<div class="sheet-bg" id="sheetBg" hidden>
  <form class="sheet" id="sheet" autocomplete="off">
    <h2 id="sheetTitle">Guthaben</h2>
    <p id="sheetHint"></p>
    <input id="sheetInput" type="text" inputmode="numeric" pattern="[0-9.]*" aria-labelledby="sheetTitle">
    <div class="quick" id="sheetQuick"></div>
    <div class="sheet-actions">
      <button type="button" id="sheetCancel">Abbrechen</button>
      <button type="submit" class="ok">Übernehmen</button>
    </div>
  </form>
</div>

<script>
(() => {
  // Amerikanischer Kessel, 37 steht für 00
  const ORDER = [0,28,9,26,30,11,7,20,32,17,5,22,34,15,3,24,36,13,1,37,27,10,25,29,12,8,19,31,18,6,21,33,16,4,23,35,14,2];
  const P = ORDER.length;
  const REDS = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const START = 1000;
  const KEY = 'kugel-roulette-v2';
  const STEP = Math.PI * 2 / P;
  const TAU = Math.PI * 2;
  const isZero = n => n === 0 || n === 37;
  const lab = n => n === 37 ? '00' : String(n);
  const colorOf = n => isZero(n) ? 'zero' : REDS.has(n) ? 'red' : 'black';
  const colorName = n => isZero(n) ? 'Grün' : REDS.has(n) ? 'Rot' : 'Schwarz';
  const fmt = n => Math.round(n).toLocaleString('de-DE');
  const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
  const short = n => n >= 1e6 ? (n / 1e6).toLocaleString('de-DE', {maximumFractionDigits: 1}) + 'M'
                   : n >= 1000 ? (n / 1000).toLocaleString('de-DE', {maximumFractionDigits: 1}) + 'k' : String(n);
  const $ = id => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ---------- Zustand ----------
  let state = {balance: START, bets: {}, history: [], lastBets: null, sound: true, chip: 10, custom: 0, lastIdx: 0,
               graph: [0], rounds: 0, wins: 0, wagered: 0};
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && typeof s.balance === 'number') state = Object.assign(state, s);
    else {
      const old = JSON.parse(localStorage.getItem('kugel-roulette-v1') || 'null');
      if (old && typeof old.balance === 'number') state.balance = old.balance + Object.values(old.bets || {}).reduce((a, v) => a + v, 0);
    }
  } catch (e) {}

  // ---------- Kessel ----------
  const canvas = $('wheel'), ctx = canvas.getContext('2d');

  let ballR = 0.655;

  function buildStatic() {

    const g = c.getContext('2d');

    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R * .965, 0, TAU); g.fill();
    const cols = {red: css('--red'), black: css('--black'), zero: css('--zero')};

    g.strokeStyle = css('--accent'); g.lineWidth = Math.max(1, R * .008);
    ORDER.forEach((n, i) => {
      const a = (i - .5) * STEP - Math.PI / 2;
      g.beginPath(); g.moveTo(Math.cos(a) * R * .60, Math.sin(a) * R * .60); g.lineTo(Math.cos(a) * R * .86, Math.sin(a) * R * .86); g.stroke();

    g.beginPath(); g.arc(0, 0, R * .86, 0, TAU); g.stroke();
    gr = g.createRadialGradient(-R * .15, -R * .15, R * .05, 0, 0, R * .6);
    gr.addColorStop(0, css('--cone')); gr.addColorStop(1, css('--cone2'));

  function resize() {

  // ---------- Gewinn-Effekt ----------
  const fx = $('fx'), fctx = fx.getContext('2d');
  let parts = [], fxRunning = false;
  function burst(power) {
    if (reduced) return;
    const S = fx.width, cx = S / 2, cy = S / 2, n = Math.min(90, 18 + Math.round(power * 6));
    const gold = css('--accent');
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, v = S * (.006 + Math.random() * .014);

  function randPocket() {
    const a = new Uint32Array(1), lim = Math.floor(4294967296 / P) * P;

  const easeOutQuint = t => 1 - Math.pow(1 - t, 5);

  $('spinBtn').onclick = spin;

    if (matchMedia('(max-width: 859px)').matches) {
      const r = $('wheelWrap').getBoundingClientRect();
      if (r.top < 0 || r.bottom > innerHeight * .6) $('wheelWrap').scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block: 'start'});
    }
    const idx = randPocket(), n = ORDER[idx];
    const dur = reduced ? 700 : 4200;
    const w0 = wheelAngle, w1 = w0 + TAU * 4 + Math.random() * TAU;
    const r0 = ballRel, target = idx * STEP;
    const r1 = r0 - (mod(r0 - target, TAU) + TAU * 10);
    const t0 = performance.now();
    let lastPocket = null, lastTick = 0, landed = false;
    prevBall = null;
    sfx.launch();
    const frame = now => {
      const t = Math.min(1, (now - t0) / dur);
      wheelAngle = w0 + (w1 - w0) * easeOutQuint(t);
      const tb = Math.min(1, t / .82);
      ballRel = r0 + (r1 - r0) * easeOutCubic(tb);
      blur = Math.max(0, 1 - tb * 1.6);
      if (t < .45) ballR = .915;
      else if (t < .82) {
        const u = (t - .45) / .37;
        ballR = .915 + (.655 - .915) * easeOutCubic(u) + Math.abs(Math.sin(u * Math.PI * 4)) * .055 * (1 - u);
      } else ballR = .655;
      if (!landed && t >= .82) { landed = true; sfx.land(); buzz(20); }
      if (t > .4) {
        const p = Math.floor(mod(ballRel, TAU) / STEP + .5);
        if (lastPocket !== null && p !== lastPocket && now - lastTick > 28) { sfx.tick(ballR < .8 ? 1 : .35); lastTick = now; }
        lastPocket = p;
      }
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else { ballRel = mod(target, TAU); wheelAngle = mod(wheelAngle, TAU); blur = 0; settle(n, idx); }
    };
    requestAnimationFrame(frame);
  }

  function settle(n, idx) {
    const bets = state.bets, t = total(bets);
    let ret = 0;
    for (const [k, v] of Object.entries(bets)) { const b = betOf(k); if (b.w(n)) ret += v * (b.m + 1); }
    const before = state.balance;
    const net = ret - t;
    state.balance += ret;
    state.lastBets = {...bets};
    state.bets = {};
    state.history.unshift(n); state.history = state.history.slice(0, 30);
    state.lastIdx = idx;
    state.rounds += 1; state.wagered += t; if (net > 0) state.wins += 1;
    state.graph.push((state.graph[state.graph.length - 1] || 0) + net);
    if (state.graph.length > 500) state.graph = state.graph.slice(-500);
    shown = {bets: {...bets}, n};
    lastResult = n;
    undo = [];
    // gleiche Einsätze bleiben für die nächste Runde liegen
    const kept = t <= state.balance;
    if (kept) { state.bets = {...bets}; state.balance -= t; for (const [k, v] of Object.entries(bets)) undo.push({key: k, a: v}); }
    // Rekord: höchster Geldstand nach einer Runde (Guthaben plus liegende Einsätze)
    state.record = Math.max(state.record || 0, state.balance + total(state.bets));
    spinning = false;
    save();
    setHub(n, true);
    render();
    drawChart();
    countUp(before, state.balance);
    for (const k of Object.keys(cells)) if (betOf(k).w(n)) cells[k].classList.add('hit');
    const head = lab(n) + ' ' + colorName(n);
    if (net > 0) {
      const ratio = net / t;
      say(head + ' · ' + signed(net), 'win', true);
      flashBalance('up'); sfx.win(ratio); burst(ratio); buzz(ratio >= 10 ? [30, 40, 30, 40, 60] : [25, 30, 40]);
      const w = $('wheelWrap'); void w.offsetWidth; w.classList.add('glow');
    } else if (net === 0) say(head + ' · Einsatz zurück', 'info');
    else if (ret > 0) { say(head + ' · ' + signed(net), 'lose'); sfx.lose(); }
    else { say(head + ' · ' + signed(net), 'lose'); flashBalance('down'); sfx.lose(); }
    if (!kept) setTimeout(() => say('Zu wenig Guthaben, um die Einsätze liegen zu lassen.', 'info'), 1600);
  }

  // ---------- Klang ----------
  let ac = null;
  function ensureAudio() {
    if (!state.sound) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function noise(dur, freq, gain, q = 8) {
    if (!state.sound || !ac) return;
    const len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; g.gain.value = gain;
    s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start();
  }
  function tone(freq, start, dur, gain, type = 'sine') {
    if (!state.sound || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + start;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
  }
  const sfx = {
    chip() { noise(.05, 2600, .5, 3); setTimeout(() => noise(.04, 3400, .35, 4), 40); },
    tick(k) { noise(.022, 4400, .32 * k, 10); },
    launch() { noise(.35, 700, .3, 1.2); tone(180, 0, .25, .05, 'triangle'); },
    land() { noise(.06, 1800, .7, 2); setTimeout(() => noise(.04, 2400, .4, 3), 70); },
    win(ratio) {
      const notes = ratio >= 10 ? [523, 659, 784, 1047, 1319, 1568] : ratio >= 2 ? [523, 659, 784, 1047] : [587, 784];
      notes.forEach((f, i) => tone(f, i * .075, .55, .12, 'triangle'));
    },
    lose() { tone(196, 0, .3, .06); },
  };

  renderSound();
  render();
  setHub(state.history.length ? state.history[0] : null);
})();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
